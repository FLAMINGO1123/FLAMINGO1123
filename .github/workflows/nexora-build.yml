name: Build Nexora Client

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'nexora-client/**'
      - '.github/workflows/nexora-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexora-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'
      - name: Build
        run: gradle clean build --stacktrace
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: nexora-client-jar
          path: nexora-client/build/libs/nexora-client-*.jar
          if-no-files-found: error
